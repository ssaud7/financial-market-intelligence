# Infrastructure for the Financial Market Intelligence System.
#
#   docker compose up -d                      # Kafka broker only (default)
#   docker compose --profile lineage up -d    # + Marquez, an OpenLineage backend
#   docker compose --profile tools up -d      # + Kafka UI for inspecting topics
#
# Airflow is NOT containerised here: it runs from .venv-airflow so the DAG can
# invoke the pipeline's own interpreter directly. See README "Running the stack".

name: fmis

services:
  # --------------------------------------------------------------------------
  # Single-node Kafka in KRaft mode (no ZooKeeper). This is a real broker; the
  # pipeline speaks to it over the wire with confluent-kafka.
  # --------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.1
    container_name: fmis-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: fmis-capstone-cluster-01
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # --------------------------------------------------------------------------
  # Optional: browse topics, inspect the dead-letter queue visually.
  # --------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fmis-kafka-ui
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fmis
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  # --------------------------------------------------------------------------
  # Optional: Marquez, the reference OpenLineage backend. With this running,
  # set OPENLINEAGE_TRANSPORT=http in .env to ship events here instead of to a
  # local JSONL file, and view the lineage graph at http://localhost:3000.
  # --------------------------------------------------------------------------
  marquez-db:
    image: postgres:14
    container_name: fmis-marquez-db
    profiles: ["lineage"]
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 10s
      timeout: 5s
      retries: 10

  marquez:
    image: marquezproject/marquez:0.49.0
    container_name: fmis-marquez
    profiles: ["lineage"]
    depends_on:
      marquez-db:
        condition: service_healthy
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez

  marquez-web:
    image: marquezproject/marquez-web:0.49.0
    container_name: fmis-marquez-web
    profiles: ["lineage"]
    depends_on:
      - marquez
    ports:
      - "3000:3000"
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000

volumes:
  kafka-data:
  marquez-db-data:
