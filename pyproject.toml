[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmis"
version = "1.0.0"
description = "Financial Market Intelligence System — an end-to-end streaming, lakehouse and RAG pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Saud Alzahrani" }]

[project.scripts]
fmis = "fmis.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a running Kafka broker",
    "spark: starts a local Spark session (slow)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
